<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img" aria-labelledby="title desc">
  <title id="title">Build Codex repository knowledge with GitSense Chat</title>
  <desc id="desc">The Codex source is analyzed, reviewed, and packaged with GitSense Chat as portable JSON manifests committed to smart-codex.</desc>
  <rect width="1600" height="470" fill="#ffffff"/>

  <rect x="60" y="54" width="390" height="360" rx="6" fill="#fafafa" stroke="#111111" stroke-width="3"/>
  <text x="255" y="106" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">SOURCE</text>
  <text x="255" y="156" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Codex repository</text>
  <line x1="110" y1="187" x2="400" y2="187" stroke="#cccccc" stroke-width="2"/>
  <text x="115" y="240" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="21">codex-rs/core/</text>
  <text x="115" y="283" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="21">codex-rs/tui/</text>
  <text x="115" y="326" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="21">codex-rs/protocol/</text>
  <text x="115" y="369" fill="#777777" font-family="Menlo, Consolas, monospace" font-size="21">sdk/  docs/  ...</text>

  <path d="M475 234 H555" fill="none" stroke="#111111" stroke-width="4"/>
  <path d="M555 234 l-15 -11 v22 z" fill="#111111"/>

  <rect x="580" y="54" width="440" height="360" rx="6" fill="#f3f3f3" stroke="#111111" stroke-width="4"/>
  <text x="800" y="106" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">BUILD AND PACKAGE</text>
  <text x="800" y="156" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle">GitSense Chat</text>
  <line x1="630" y1="187" x2="970" y2="187" stroke="#bbbbbb" stroke-width="2"/>
  <text x="800" y="236" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle">Define what matters</text>
  <text x="800" y="278" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle">Analyze the repository</text>
  <text x="800" y="320" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle">Review and refine</text>
  <text x="800" y="362" fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle">Package the results</text>

  <path d="M1045 234 H1125" fill="none" stroke="#111111" stroke-width="4"/>
  <path d="M1125 234 l-15 -11 v22 z" fill="#111111"/>

  <rect x="1150" y="54" width="390" height="360" rx="6" fill="#fafafa" stroke="#111111" stroke-width="3"/>
  <text x="1345" y="106" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">COMMITTED KNOWLEDGE</text>
  <text x="1345" y="156" fill="#111111" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Portable manifests</text>
  <line x1="1200" y1="187" x2="1490" y2="187" stroke="#cccccc" stroke-width="2"/>
  <text x="1200" y="235" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="19">.gitsense/manifests/</text>
  <text x="1230" y="276" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="18">code-intent.json</text>
  <text x="1230" y="314" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="18">codex-rust-navigation.json</text>
  <text x="1230" y="352" fill="#333333" font-family="Menlo, Consolas, monospace" font-size="18">rust-blast-radius.json</text>
  <text x="1230" y="386" fill="#777777" font-family="Menlo, Consolas, monospace" font-size="18">...and more</text>
</svg>
